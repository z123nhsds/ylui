<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YLUI 路由修复</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        .card {
            width: min(520px, calc(100vw - 32px));
            padding: 24px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.88);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>正在处理静态路由…</h1>
        <p id="message">如果没有自动跳转，请手动访问文档首页。</p>
        <p><a id="fallback" href="./documents/">打开文档中心</a></p>
    </div>
    <script>
        (function () {
            var pathname = window.location.pathname || '';
            var normalized = pathname.replace(/\/+$/, '');
            var fallback = document.getElementById('fallback');
            if (/\/documents$/.test(normalized)) {
                var target = pathname.replace(/\/+$/, '') + '/' + window.location.search + window.location.hash;
                fallback.href = target;
                document.getElementById('message').textContent = '检测到 /documents 静态路由，正在自动补全目录索引。';
                window.location.replace(target);
                return;
            }
            fallback.href = './documents/';
        })();
    </script>
</body>
</html>
